---
- name: Service | systemd unit
  ansible.builtin.template:
    src: fb-receiver.service.j2
    dest: "{{ fb_receiver_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart fb-receiver

- name: Service | Enabled and running
  ansible.builtin.systemd:
    name: "{{ fb_receiver_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
