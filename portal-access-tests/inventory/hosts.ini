[local]
localhost ansible_connection=local

# Client machine the Admin portal is used from (needs curl)
[admin_portal_clients]
server1.example.internal

# Client machine the User portal is used from
[user_portal_clients]
winserver1.example.internal

[user_portal_clients:vars]
ansible_connection=winrm                 # or: ssh + ansible_shell_type=powershell
ansible_port=5986
ansible_winrm_transport=kerberos         # EXAMPLE — match your WinRM setup
ansible_winrm_server_cert_validation=validate
